# ==============================================================================
# Tier 3: Stateful Processing Gateway (Tail Sampling & Backend Ingestion)
# ==============================================================================
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector-tier3-processor
  namespace: observability
spec:
  # StatefulSet mode provides a stable headless service and sticky identity for the router
  mode: statefulset
  replicas: 3
  image: otel/opentelemetry-collector-contrib:0.159.0
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: otel-collector-tier3-processor-collector
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
  env:
    - name: AMP_ENDPOINT
      valueFrom:
        configMapKeyRef:
          name: amp-config
          key: endpoint
          optional: true
    # Processor Go GC tuning: 80% of 1GiB limit ≈ 800MiB
    - name: GOMEMLIMIT
      value: "800MiB"
    - name: GOGC
      value: "80"
  # Stateless Processor: schedules on spot-primary (or on-demand-fallback)
  # Batch processor buffer flushes gracefully on SIGTERM before spot termination.
  config:
    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"
      # sigv4auth:
      #   region: "us-east-1"
      #   service: "aps"
    receivers:
      # Internal receiver for load-balanced traffic from Tier 2 Router
      otlp/internal:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4319
      prometheus/meta_monitoring:
        config:
          scrape_configs:
            - job_name: 'otel-collector-tier2-router'
              scrape_interval: 15s
              static_configs:
                - targets: ['otel-collector-tier2-router-collector.observability.svc.cluster.local.:8888']
            - job_name: 'otel-collector-tier3-processor'
              scrape_interval: 15s
              static_configs:
                - targets: ['127.0.0.1:8889']
            - job_name: 'loki'
              scrape_interval: 15s
              static_configs:
                - targets: ['loki.observability.svc.cluster.local.:3100']
            - job_name: 'tempo'
              scrape_interval: 15s
              static_configs:
                - targets: ['tempo.observability.svc.cluster.local.:3200']
            - job_name: 'mimir'
              scrape_interval: 15s
              static_configs:
                - targets:
                    - 'mimir-distributor.observability.svc.cluster.local.:8080'
                    - 'mimir-ingester.observability.svc.cluster.local.:8080'
                    - 'mimir-querier.observability.svc.cluster.local.:8080'
                    - 'mimir-query-frontend.observability.svc.cluster.local.:8080'
                    - 'mimir-ruler.observability.svc.cluster.local.:8080'
                    - 'mimir-alertmanager.observability.svc.cluster.local.:8080'
                    - 'mimir-compactor.observability.svc.cluster.local.:8080'
                    - 'mimir-store-gateway.observability.svc.cluster.local.:8080'
            - job_name: 'grafana'
              scrape_interval: 15s
              static_configs:
                - targets: ['grafana.observability.svc.cluster.local.:80']
            - job_name: 'kube-state-metrics'
              scrape_interval: 15s
              static_configs:
                - targets: ['kube-state-metrics.observability.svc.cluster.local.:8080']
            - job_name: 'node-exporter'
              scrape_interval: 15s
              static_configs:
                - targets: ['node-exporter.observability.svc.cluster.local.:9100']
    processors:
      # Filter processor to discard noisy low-level HTTP transport spans
      filter/drop_noisy_asgi:
        error_mode: ignore
        traces:
          span:
            - 'IsMatch(name, ".*http send.*")'
            - 'IsMatch(name, ".*http receive.*")'
      filter/lb_health_checks:
        error_mode: ignore
        traces:
          span:
            - 'IsMatch(attributes["user_agent.original"], "ELB-HealthChecker.*")'
            - 'IsMatch(attributes["http.user_agent"], "ELB-HealthChecker.*")'

      # Memory Limiter protects the collector from crashing on trace spikes
      # https://github.com/open-telemetry/opentelemetry-collector/blob/main/processor/memorylimiterprocessor/README.md
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15

      # Tail sampling collects all spans of a trace before evaluating rules
      tail_sampling:
        decision_wait: 10s
        num_traces: 10000
        policies:
          # Policy 1: Always keep errors (100% sampling rate)
          - name: keep-errors
            type: status_code
            status_code: { status_codes: [ERROR] }
          # Policy 2: Sample HTTP 200/OK at 10% rate for cost efficiency (90% reduction on healthy traces)
          - name: sample-success
            type: probabilistic
            probabilistic: { sampling_percentage: 10.0 }
          # Policy 3: Keep any trace that takes longer than 2 seconds (2000 ms)
          - name: keep-latency-spikes
            type: latency
            latency: { threshold_ms: 2000 }

      # Batch processor tuned for large write payloads to Tempo, Loki, and AMP
      batch:
        send_batch_size: 8192
        send_batch_max_size: 16384
        timeout: 500ms

      # Transform processor using OTTL (OpenTelemetry Transformation Language)
      transform/standardize_http:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              # 1. Map http.status_code to http.response.status_code
              - set(attributes["http.response.status_code"], attributes["http.status_code"]) where attributes["http.status_code"] != nil
              - delete_key(attributes, "http.status_code")
              # 2. Map http.method to http.request.method
              - set(attributes["http.request.method"], attributes["http.method"]) where attributes["http.method"] != nil
              - delete_key(attributes, "http.method")
              # 3. Map http.target to url.path
              - set(attributes["url.path"], attributes["http.target"]) where attributes["http.target"] != nil
              - delete_key(attributes, "http.target")

    connectors:
      # Spanmetrics connector: Aggregates 100% of raw traces into Prometheus RED metrics
      # (Rate, Errors, Duration) before tail-sampling drops healthy traces.
      spanmetrics:
        histogram:
          explicit:
            buckets: [10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s]
        dimensions:
          - name: http.response.status_code
          - name: http.request.method
        dimensions_cache_size: 1000
        metrics_flush_interval: 15s

    exporters:
      # Pushes metrics to Amazon Managed Prometheus (AMP) via AWS SigV4 (uncomment if using AMP)
      # prometheusremotewrite/amp:
      #   endpoint: "${env:AMP_ENDPOINT}"
      #   auth:
      #     authenticator: sigv4auth

      # Pushes metrics to Mimir via Prometheus remote write HTTP API (Default)
      prometheusremotewrite:
        endpoint: "http://mimir-gateway.observability.svc.cluster.local./api/v1/push"
        tls:
          insecure: true
      
      # Pushes traces to Tempo with zstd compression
      otlp/tempo:
        endpoint: "tempo.observability.svc.cluster.local.:4317"
        compression: zstd
        tls:
          insecure: true

      # Optional AWS X-Ray exporter for CloudWatch traces (uncomment if using X-Ray)
      # awsxray:
      #   region: "us-east-1"

      # Optional Kafka log buffer with LZ4 compression for ultra-fast Logstash decompression
      # Re-enable when deploying the enterprise ELK analytics tier.
      # kafka/logs:
      #   brokers:
      #     - "kafka.observability.svc.cluster.local.:9092"
      #   protocol_version: "2.0.0"
      #   topic: "otel-logs-buffer"
      #   encoding: otlp_json
      #   compression: lz4

      # Pushes logs to Loki over its native OTLP endpoint.
      otlphttp/loki:
        endpoint: "http://loki.observability.svc.cluster.local.:3100/otlp"
        tls:
          insecure: true

    service:
      # Use [health_check] for self-hosted Mimir (default). Add sigv4auth if exporting to Amazon Managed Prometheus.
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8889
      pipelines:
        # Pipeline 2A: Receives 100% of spans, computes RED metrics with zero data loss
        traces/metrics:
          receivers: [otlp/internal]
          processors:
            [
              memory_limiter,
              filter/drop_noisy_asgi,
              filter/lb_health_checks,
              transform/standardize_http,
            ]
          exporters: [spanmetrics]

        # Pipeline 2B: Receives spans, applies tail sampling (10% success, 100% error/spikes) and exports to Tempo S3
        traces/storage:
          receivers: [otlp/internal]
          processors:
            [
              memory_limiter,
              filter/drop_noisy_asgi,
              filter/lb_health_checks,
              transform/standardize_http,
              tail_sampling,
              batch,
            ]
          exporters: [otlp/tempo]

        # Pipeline 3: Metrics pipeline (Application metrics, meta-monitoring, plus spanmetrics RED data)
        metrics:
          receivers: [otlp/internal, prometheus/meta_monitoring, spanmetrics]
          processors: [memory_limiter, batch]
          # Pushes to self-hosted Mimir by default. Swap to prometheusremotewrite/amp if using AWS AMP.
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp/internal]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/loki]
