# ==============================================================================
# Tier 2: Stateless Ingress Router (Trace-ID Consistent Hashing)
# ==============================================================================
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector-tier2-router
  namespace: monitoring
spec:
  mode: deployment
  autoscaler:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 80
  image: otel/opentelemetry-collector-contrib:0.156.0
  
  # Without an explicit request the operator creates the pods with none, so the
  # scheduler treats two gateway replicas as free and the HPA has no CPU
  # baseline to compute targetCPUUtilization against.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  env:
    # Router Go GC tuning: 80% of 256MiB limit ≈ 200MiB
    - name: GOMEMLIMIT
      value: "200MiB"
    - name: GOGC
      value: "80"
  config:
    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      # Memory Limiter protects the router from crashing
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15

      # Ensure service.name exists for load balancer routing_key: service
      transform/default_service_name:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["service.name"] == nil and attributes["k8s.container.name"] != nil
              - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["service.name"] == nil and attributes["k8s.deployment.name"] != nil
              - set(attributes["service.name"], attributes["k8s.pod.name"]) where attributes["service.name"] == nil and attributes["k8s.pod.name"] != nil
              - set(attributes["service.name"], attributes["k8s.namespace.name"]) where attributes["service.name"] == nil and attributes["k8s.namespace.name"] != nil
              - set(attributes["service.name"], "infrastructure") where attributes["service.name"] == nil
        log_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["service.name"] == nil and attributes["k8s.container.name"] != nil
              - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["service.name"] == nil and attributes["k8s.deployment.name"] != nil
              - set(attributes["service.name"], attributes["k8s.pod.name"]) where attributes["service.name"] == nil and attributes["k8s.pod.name"] != nil
              - set(attributes["service.name"], attributes["k8s.namespace.name"]) where attributes["service.name"] == nil and attributes["k8s.namespace.name"] != nil
              - set(attributes["service.name"], "unallocated") where attributes["service.name"] == nil
    exporters:
      # Trace affinity load balancer - hashes by traceID with zstd compression to Tier 3 Processor
      loadbalancing/traces:
        routing_key: traceID
        protocol:
          otlp:
            compression: zstd
            tls:
              insecure: true
        resolver:
          k8s:
            service: otel-collector-tier3-processor-collector
            ports:
              - 4319
      # Metrics and Logs load balancer - hashes by service name with zstd compression to Tier 3 Processor
      loadbalancing/metrics-logs:
        routing_key: service
        protocol:
          otlp:
            compression: zstd
            tls:
              insecure: true
        resolver:
          k8s:
            service: otel-collector-tier3-processor-collector
            ports:
              - 4319
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        # Pipeline 1: Receives traces from Tier 1 Agent / NLB and routes them by TraceID to Tier 3 Processor
        traces:
          receivers: [otlp]
          processors: [memory_limiter]
          exporters: [loadbalancing/traces]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, transform/default_service_name]
          exporters: [loadbalancing/metrics-logs]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, transform/default_service_name]
          exporters: [loadbalancing/metrics-logs]
---
# ==============================================================================
# Tier 3: Stateful Processing Gateway (Tail Sampling & Backend Ingestion)
# ==============================================================================
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector-tier3-processor
  namespace: monitoring
spec:
  # StatefulSet mode provides a stable headless service and sticky identity for the router
  mode: statefulset
  replicas: 3
  image: otel/opentelemetry-collector-contrib:0.156.0
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
  env:
    - name: AMP_ENDPOINT
      valueFrom:
        configMapKeyRef:
          name: amp-config
          key: endpoint
          optional: true
    # Processor Go GC tuning: 80% of 1GiB limit ≈ 800MiB
    - name: GOMEMLIMIT
      value: "800MiB"
    - name: GOGC
      value: "80"
  config:
    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"
      sigv4auth:
        region: "us-east-1"
        service: "aps"
    receivers:
      # Internal receiver for load-balanced traffic from Tier 2 Router
      otlp/internal:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4319
      prometheus/meta_monitoring:
        config:
          scrape_configs:
            - job_name: 'otel-collector-tier2-router'
              scrape_interval: 15s
              static_configs:
                - targets: ['otel-collector-tier2-router-collector-monitoring:8888']
            - job_name: 'otel-collector-tier3-processor'
              scrape_interval: 15s
              static_configs:
                - targets: ['127.0.0.1:8889']
    processors:
      # Filter processor to discard noisy low-level HTTP transport spans
      filter/drop_noisy_asgi:
        error_mode: ignore
        traces:
          span:
            - 'IsMatch(name, ".*http send.*")'
            - 'IsMatch(name, ".*http receive.*")'
      filter/lb_health_checks:
        error_mode: ignore
        traces:
          span:
            - 'IsMatch(attributes["user_agent.original"], "ELB-HealthChecker.*")'
            - 'IsMatch(attributes["http.user_agent"], "ELB-HealthChecker.*")'

      # Memory Limiter protects the collector from crashing on trace spikes
      # https://github.com/open-telemetry/opentelemetry-collector/blob/main/processor/memorylimiterprocessor/README.md
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15

      # Tail sampling collects all spans of a trace before evaluating rules
      tail_sampling:
        decision_wait: 10s
        num_traces: 10000
        policies:
          # Policy 1: Always keep errors (100% sampling rate)
          - name: keep-errors
            type: status_code
            status_code: { status_codes: [ERROR] }
          # Policy 2: Sample HTTP 200/OK at 100% rate in development
          - name: sample-success
            type: probabilistic
            probabilistic: { sampling_percentage: 100.0 }
          # Policy 3: Keep any trace that takes longer than 2 seconds (2000 ms)
          - name: keep-latency-spikes
            type: latency
            latency: { threshold_ms: 2000 }
          ## Policy 4: Keep services, and discard the rest of services
          #- name: keep-specific-services
          #  type: string_attribute
          #  string_attribute:
          #    {
          #      key: service.name,
          #      values: ["python-product-info-service", "golang-product-service"],
          #    }

      # Batch processor tuned for large write payloads to Tempo, Loki, and AMP
      batch:
        send_batch_size: 8192
        send_batch_max_size: 16384
        timeout: 500ms

      # Transform processor using OTTL (OpenTelemetry Transformation Language)
      transform/standardize_http:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              # 1. Map http.status_code to http.response.status_code
              - set(attributes["http.response.status_code"], attributes["http.status_code"]) where attributes["http.status_code"] != nil
              - delete_key(attributes, "http.status_code")
              # 2. Map http.method to http.request.method
              - set(attributes["http.request.method"], attributes["http.method"]) where attributes["http.method"] != nil
              - delete_key(attributes, "http.method")
              # 3. Map http.target to url.path
              - set(attributes["url.path"], attributes["http.target"]) where attributes["http.target"] != nil
              - delete_key(attributes, "http.target")

    exporters:
      # Pushes metrics to Amazon Managed Prometheus (AMP) via AWS SigV4
      prometheusremotewrite/amp:
        endpoint: "${env:AMP_ENDPOINT}"
        auth:
          authenticator: sigv4auth

      # Pushes metrics to Mimir via Prometheus remote write HTTP API (Fallback)
      prometheusremotewrite:
        endpoint: "http://mimir-gateway.monitoring.svc.cluster.local/api/v1/push"
        tls:
          insecure: true
      
      # Pushes traces to Tempo with zstd compression
      otlp/tempo:
        endpoint: "tempo.monitoring.svc.cluster.local:4317"
        compression: zstd
        tls:
          insecure: true

      # Optional AWS X-Ray exporter for CloudWatch traces
      awsxray:
        region: "us-east-1"

      # Optional Kafka log buffer with LZ4 compression for ultra-fast Logstash decompression
      # Re-enable when deploying the enterprise ELK analytics tier.
      # kafka/logs:
      #   brokers:
      #     - "kafka.monitoring.svc.cluster.local:9092"
      #   protocol_version: "2.0.0"
      #   topic: "otel-logs-buffer"
      #   encoding: otlp_json
      #   compression: lz4

      # Pushes logs to Loki over its native OTLP endpoint.
      #
      # The dedicated `loki` exporter this used to call is deprecated upstream
      # and has been removed from opentelemetry-collector-contrib. Loki 3.x
      # accepts OTLP directly at /otlp/v1/logs — otlphttp appends the /v1/logs
      # suffix, so the endpoint below stops at /otlp.
      #
      # The `loki-gateway` service no longer exists either: the chart's nginx
      # gateway is disabled, so writes go straight to the single-binary pod.
      otlphttp/loki:
        endpoint: "http://loki.monitoring.svc.cluster.local:3100/otlp"
        tls:
          insecure: true

    service:
      extensions: [health_check, sigv4auth]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8889
      pipelines:
        # Pipeline 2: Receives trace-affinity routed spans and performs tail sampling
        traces:
          receivers: [otlp/internal]
          processors:
            [
              memory_limiter,
              filter/drop_noisy_asgi,
              filter/lb_health_checks,
              transform/standardize_http,
              tail_sampling,
              batch,
            ]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp/internal, prometheus/meta_monitoring]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite/amp]
        logs:
          receivers: [otlp/internal]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/loki]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-gateway-role
rules:
  - apiGroups: [""]
    resources: ["endpoints", "pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-tier2-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-gateway-role
subjects:
  - kind: ServiceAccount
    name: otel-collector-tier2-router-collector
    namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-tier3-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-gateway-role
subjects:
  - kind: ServiceAccount
    name: otel-collector-tier3-processor-collector
    namespace: monitoring
