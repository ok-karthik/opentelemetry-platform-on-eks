# ==============================================================================
# ConfigMap 10: Unified AWS Infrastructure Incident Triage Dashboard
# ==============================================================================
# Combines:
# - CloudWatch: AWS Application Load Balancer (ALB) and RDS Aurora / ElastiCache metrics
# - Mimir / Prometheus: EKS Pod CPU CFS throttling and OTel Gateway queue health
# - Loki: Real-time application error logs correlated by TraceID
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-aws-infrastructure-triage
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  aws-infrastructure-triage-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": 10,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "AWS Ingress Layer (CloudWatch ALB)",
          "type": "row"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 1 },
          "id": 1,
          "title": "ALB Target Response Time (Latency)",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "cloudwatch", "uid": "cloudwatch" },
              "queryMode": "Metrics",
              "namespace": "AWS/ApplicationELB",
              "metricName": "TargetResponseTime",
              "statistic": "Average",
              "period": "60",
              "refId": "A"
            },
            {
              "datasource": { "type": "cloudwatch", "uid": "cloudwatch" },
              "queryMode": "Metrics",
              "namespace": "AWS/ApplicationELB",
              "metricName": "TargetResponseTime",
              "statistic": "p95",
              "period": "60",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "s"
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 1 },
          "id": 2,
          "title": "ALB 5XX Errors (Target vs ELB)",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "cloudwatch", "uid": "cloudwatch" },
              "queryMode": "Metrics",
              "namespace": "AWS/ApplicationELB",
              "metricName": "HTTPCode_Target_5XX_Count",
              "statistic": "Sum",
              "period": "60",
              "refId": "A"
            },
            {
              "datasource": { "type": "cloudwatch", "uid": "cloudwatch" },
              "queryMode": "Metrics",
              "namespace": "AWS/ApplicationELB",
              "metricName": "HTTPCode_ELB_5XX_Count",
              "statistic": "Sum",
              "period": "60",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "bars" },
              "unit": "short",
              "min": 0
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 8 },
          "id": 200,
          "title": "EKS Workload & Gateway Health (Prometheus / Mimir)",
          "type": "row"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 9 },
          "id": 3,
          "title": "Container CPU CFS Quota Throttling",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum by (pod, namespace) (rate(container_cpu_cfs_throttled_periods_total{namespace=~\"default|observability\"}[5m])) > 0",
              "legendFormat": "{{namespace}} / {{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line" },
              "unit": "ops",
              "min": 0
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 9 },
          "id": 4,
          "title": "OTel Gateway Ingress Rate (spans/sec)",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum by (service_name) (rate(calls_total[1m])) or sum(rate(otelcol_receiver_accepted_spans_total[1m]))",
              "legendFormat": "{{service_name}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line" },
              "unit": "reqps",
              "min": 0
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 16 },
          "id": 300,
          "title": "AWS Managed Data & Storage Layer (CloudWatch RDS & ElastiCache)",
          "type": "row"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 17 },
          "id": 5,
          "title": "RDS Database Connections & CPU",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "cloudwatch", "uid": "cloudwatch" },
              "queryMode": "Metrics",
              "namespace": "AWS/RDS",
              "metricName": "CPUUtilization",
              "statistic": "Average",
              "period": "60",
              "refId": "A"
            },
            {
              "datasource": { "type": "cloudwatch", "uid": "cloudwatch" },
              "queryMode": "Metrics",
              "namespace": "AWS/RDS",
              "metricName": "DatabaseConnections",
              "statistic": "Average",
              "period": "60",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line" },
              "unit": "short",
              "min": 0
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 17 },
          "id": 6,
          "title": "ElastiCache Redis Engine CPU & Cache Hits",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "cloudwatch", "uid": "cloudwatch" },
              "queryMode": "Metrics",
              "namespace": "AWS/ElastiCache",
              "metricName": "EngineCPUUtilization",
              "statistic": "Average",
              "period": "60",
              "refId": "A"
            },
            {
              "datasource": { "type": "cloudwatch", "uid": "cloudwatch" },
              "queryMode": "Metrics",
              "namespace": "AWS/ElastiCache",
              "metricName": "CacheHits",
              "statistic": "Sum",
              "period": "60",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line" },
              "unit": "short",
              "min": 0
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 24 },
          "id": 400,
          "title": "Application Error Logs (Loki)",
          "type": "row"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 25 },
          "id": 7,
          "title": "Application Errors (Trace Correlated)",
          "type": "logs",
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "editorMode": "code",
              "expr": "{namespace=~\"default|observability\"} |~ \"(?i)(error|exception|fail|timeout)\"",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "options": {
            "showLabels": true,
            "wrapLogMessage": true,
            "enableLogDetails": true
          }
        }
      ],
      "refresh": "1m",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["aws", "cloudwatch", "alb", "rds", "triage", "incident"],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": ["1m", "5m", "15m", "30m", "1h"]
      },
      "timezone": "browser",
      "title": "AWS Infrastructure & Workload Incident Triage",
      "uid": "aws-infrastructure-triage"
    }
