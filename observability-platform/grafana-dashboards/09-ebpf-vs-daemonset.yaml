          "options": {
            "mode": "markdown",
            "content": "### \ud83c\udfdb\ufe0f The 4 Telemetry Instrumentation Levels in OpenTelemetry\n\n| Telemetry Dimension | \u26a1 Level 1: Kernel eBPF (OBI DaemonSet) | \ud83d\udc89 Level 2: Runtime Injected (OTel Operator) | \ud83d\udee0\ufe0f Level 3: Programmatic SDK (Go/Rust/C++) | \ud83d\udee1\ufe0f Tier 1 DaemonSet (Host OS & Kubelet) |\n| :--- | :--- | :--- | :--- | :--- |\n| **Code Modification Required** | \ud83d\udfe2 **Zero Code Changes** (Day-1 Instant) | \ud83d\udfe2 **Zero Code Changes** (Pod annotations) | \ud83d\udfe1 **Explicit Code SDK Bootstrap** | \ud83d\udfe2 **Zero Code Changes** (Cluster Infra) |\n| **Container Rebuild Required** | \ud83d\udfe2 **No Container Image Rebuild** | \ud83d\udfe2 **No Rebuild** (Init container mounts agent) | \ud83d\udd34 **Requires Binary Recompile** | \ud83d\udfe2 **No Rebuild** |\n| **Target Workload Types** | \ud83c\udf10 **Any Binary** (Nginx, C++, Bookinfo, Envoy) | \u2615 **Runtimes Only** (Node.js, Python, Java, .NET) | \ud83d\udc39 **Compiled Languages** (Go, Rust, C++) | \ud83d\udce6 **All Pods on Host** |\n| **HTTP / gRPC Server Latency** | \u2705 **Native** (Linux kernel socket probes) | \u2705 **Native** (Framework monkey-patching) | \u2705 **Native** (HTTP middleware wrapper) | \u274c *Relies on App SDK / eBPF* |\n| **SQL Queries (`SELECT * ...`)**| \u274c *Cannot inspect encrypted user-space SQL*| \u2705 **Native** (`db.statement` captured) | \u2705 **Native** (Database driver instrumentation)| \u274c *No SQL awareness* |\n| **Exceptions & Stack Traces** | \u274c *Cannot see language stack traces* | \u2705 **Native** (Captures uncaught exceptions) | \u2705 **Native** (Explicit span.RecordError()) | \u274c *No runtime awareness* |\n| **OOMKilled & Crash Detection** | \u2705 **Instant Kernel Process Exit (Exit 137)** | \u274c *SDK crashes before buffers flush* | \u274c *Process terminated before flush* | \u274c *Detected after container restart* |\n| **Container Cgroup Memory (RAM)**| \u274c *No cgroup memory tracking* | \u274c *No cgroup tracking (only runtime heap)* | \u274c *No cgroup tracking (only runtime heap)* | \u2705 **Native** (`kubeletstats` vs limits) |\n| **Container CPU CFS Quotas** | \u274c *No CFS quota tracking* | \u274c *No CFS tracking* | \u274c *No CFS tracking* | \u2705 **Native** (`kubeletstats` vs cores) |\n| **Stdout/Stderr Logs Ingestion**| \u274c *Metrics and traces only (0 Logs)* | \u274c *Exports OTLP application logs* | \u274c *Exports OTLP application logs* | \u2705 **Native** (`filelog` on `/var/log/pods`) |\n| **Metadata & Tenant Enrichment**| \u2705 *Process PID / ELF inspection* | \ud83d\udd04 *Forwarded to Tier 1 Collector* | \ud83d\udd04 *Forwarded to Tier 1 Collector* | \u2705 **Native** (`k8sattributes` Downward API cache) |\n| **Privileges Required** | \u26a0\ufe0f `hostPID: true`, `CAP_BPF` | \ud83d\udfe2 Standard Unprivileged Pod | \ud83d\udfe2 Standard Unprivileged Pod | \ud83d\udfe2 `hostNetwork: true` for hostIP |\n\n---\n### \ud83d\udca1 Synthesis: How Tier 1 Combines All 3 Telemetry Levels\n**Tier 1 (Node-Local DaemonSet)** is the node-level aggregation engine of the platform:\n1. It receives **Level 1 (Kernel eBPF)** metrics from localhost.\n2. It receives **Level 2 (Injected Operator)** & **Level 3 (Code SDK)** traces/metrics from application pods via `status.hostIP:4317`.\n3. It directly samples **Cgroup RAM, CPU CFS quotas, and Virtual Network I/O** via Kubelet API (`:10250`).\n4. It streams **stdout/stderr container logs** from `/var/log/pods`.\n5. It enriches **100% of telemetry** with local Kubernetes metadata (`k8s.pod.name`, `k8s.namespace.name`, `team`, `tenant.id`) before routing upstream to the **Central Observability Gateway (Tier 2/3)**.\n"
          }
        }
