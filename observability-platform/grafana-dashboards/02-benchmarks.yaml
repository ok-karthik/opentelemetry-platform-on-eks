# ==============================================================================
# ConfigMap 2: High-Scale Benchmarking & Pipeline Capacity
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-benchmarks
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  benchmark-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": 5,
      "uid": "benchmark-traffic",
      "links": [],
      "liveNow": true,
      "refresh": "5s",
      "schemaVersion": 36,
      "style": "dark",
      "tags": [
        "benchmarking",
        "load-test",
        "throughput"
      ],
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "title": "High-Scale Benchmarking & Capacity Overview",
      "version": 4,
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "id": 201,
          "title": "OTel Pipeline: Ingestion Spans Rate",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(otelcol_receiver_accepted_spans_total[1m])) or sum(rate(otelcol_receiver_accepted_spans[1m]))",
              "legendFormat": "Total Spans / sec",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cps"
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "id": 202,
          "title": "OTel Pipeline: Ingestion Logs Rate",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(otelcol_receiver_accepted_log_records_total[1m])) or sum(rate(otelcol_receiver_accepted_log_records_total[1m]))",
              "legendFormat": "Total Logs / sec",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cps"
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "id": 203,
          "title": "OTel Pipeline: Ingestion Metrics Rate",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(otelcol_receiver_accepted_metric_points_total[1m])) or sum(rate(otelcol_receiver_accepted_metric_points[1m]))",
              "legendFormat": "Total Metrics / sec",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cps"
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 204,
          "title": "Application Services HTTP QPS Breakdown",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (job) (rate(http_server_request_duration_seconds_count[2m])) or sum by (service_name) (rate(http_server_request_duration_seconds_count[2m]))",
              "legendFormat": "{{job}}{{service_name}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "id": 205,
          "title": "Tempo Ingestion: Exported Spans Rate",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(otelcol_exporter_sent_spans_total[1m]))",
              "legendFormat": "Sent to Tempo (Traces/sec)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cps"
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "id": 206,
          "title": "OTel Collector Pod Memory Working Set (RAM)",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (job) (k8s_pod_memory_working_set_bytes{job=~\"otel-collector.*\"})",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "id": 207,
          "title": "OTel Collector Pod CPU Usage (Cores)",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (job) (k8s_pod_cpu_usage{job=~\"otel-collector.*\"})",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        }
      ]
    }
