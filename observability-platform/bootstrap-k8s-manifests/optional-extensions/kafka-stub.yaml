# ==============================================================================
# Optional: Kafka Stub for Enterprise Telemetry Ingestion Buffering
# ==============================================================================
# DEFAULT STATUS:
# - Disabled/Optional by default. By default, OTel Gateways stream directly to Loki/Tempo/Mimir.
# - Enabled when deploying the optional Kafka -> Logstash -> OpenSearch log pipeline
#   or when high-burst buffering (>25,000 events/sec) is required.
#
# PURPOSE & ARCHITECTURAL USE CASE:
# - Absorbs extreme traffic spikes (5x-10x flash sales, thundering herds) without
#   collector `memory_limiter` dropping telemetry.
# - Decouples backend storage maintenance: provides 24-48 hours of disk-backed lag persistence.
# - Multi-consumer fan-out: allows streaming the same telemetry simultaneously to Loki,
#   OpenSearch SIEM, and S3 data lakes.
#
# HOW TO DEPLOY:
# 1. Apply this stub: `kubectl apply -f observability-platform/k8s-manifests/optional-extensions/kafka-stub.yaml`
# 2. Re-enable the `kafka/logs` exporter in `observability-platform/k8s-manifests/otel-collector-gateway.yaml`
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: monitoring
spec:
  ports:
    - name: client
      port: 9092
      protocol: TCP
      targetPort: 9092
  selector:
    app.kubernetes.io/name: kafka-stub
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-stub
  namespace: monitoring
spec:
  replicas: 1
  serviceName: kafka
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-stub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-stub
    spec:
      containers:
        - name: kafka
          image: bitnami/kafka:3.6
          env:
            - name: KAFKA_CFG_NODE_ID
              value: "0"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: "controller,broker"
            - name: KAFKA_CFG_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-stub-0.kafka.monitoring.svc.cluster.local:9093"
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
          ports:
            - name: client
              containerPort: 9092
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
