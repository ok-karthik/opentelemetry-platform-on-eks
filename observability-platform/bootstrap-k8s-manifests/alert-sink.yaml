# Stand-in for a real on-call destination (Slack/PagerDuty/Opsgenie). Logs
# every request body it receives, so a fired burn-rate alert is verifiable
# with `kubectl logs -n monitoring -l app=alert-sink` instead of trusting that
# Alertmanager sent something. See the fallbackConfig comment in
# mimir.yaml.tftpl for how to swap this for a real receiver.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  namespace: monitoring
  labels:
    app: alert-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-sink
  template:
    metadata:
      labels:
        app: alert-sink
    spec:
      containers:
        - name: alert-sink
          image: mendhak/http-https-echo:31
          ports:
            - containerPort: 8080
          env:
            - name: HTTP_PORT
              value: "8080"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
  namespace: monitoring
spec:
  selector:
    app: alert-sink
  ports:
    - port: 8080
      targetPort: 8080
