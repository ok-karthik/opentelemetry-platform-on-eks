# ==============================================================================
# Argo CD Root Application (App-of-Apps Pattern)
# ==============================================================================
# Managed via AWS EKS Managed Capability for Argo CD (`control-plane-argocd`).
#
# HOW IT WORKS:
# - Runs inside AWS-managed service infrastructure (zero worker node compute/RAM).
# - Automatically discovers and reconciles all child Application manifests located
#   in the `apps/` directory across both EKS clusters.
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-platform-apps
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/ok-karthik/opentelemetry-platform-on-eks.git
    targetRevision: main
    path: observability-platform/gitops/gitops-app-of-apps/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
