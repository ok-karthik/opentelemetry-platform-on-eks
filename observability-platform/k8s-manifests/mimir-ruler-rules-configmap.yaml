# Multi-window, multi-burn-rate SLO alerts (Google SRE Workbook pattern) for
# both demo services. Mounted into the Mimir ruler at
# /var/mimir-ruler-rules/anonymous/ — see mimir.yaml.tftpl for why `local`
# ruler storage and not the S3 backend everything else here uses.
#
# SLO: 99.5% availability (0.5% error budget) over a rolling 30-day window.
# Four alerts per service, each pairing a long window (the real signal) with a
# short window (so the alert clears quickly once the failure stops) — a single
# window would either miss short severe spikes or false-page on brief blips.
# Burn rate is how many times faster than the sustainable rate the error
# budget is being spent; 14.4x for 1 hour exhausts a 30-day budget in ~2 days.
#
# | Severity | Burn rate | Long window | Short window | For  |
# |----------|-----------|--------------|---------------|------|
# | page     | 14.4x     | 1h           | 5m            | 2m   |
# | page     | 6x        | 6h           | 30m           | 15m  |
# | ticket   | 3x        | 1d           | 2h            | 1h   |
# | ticket   | 1x        | 3d           | 6h            | 3h   |
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-ruler-rules
  namespace: monitoring
data:
  golang-product-service.yaml: |
    groups:
      - name: golang-product-service-slo-burn-rate
        rules:
          - alert: GolangProductServiceErrorBudgetBurnFast
            expr: |
              (
                sum(rate(http_server_duration_milliseconds_count{service_name="golang-product-service", http_status_code=~"5.."}[1h]))
                /
                sum(rate(http_server_duration_milliseconds_count{service_name="golang-product-service"}[1h]))
              ) > (14.4 * 0.005)
              and
              (
                sum(rate(http_server_duration_milliseconds_count{service_name="golang-product-service", http_status_code=~"5.."}[5m]))
                /
                sum(rate(http_server_duration_milliseconds_count{service_name="golang-product-service"}[5m]))
              ) > (14.4 * 0.005)
            for: 2m
            labels:
              severity: page
              service: golang-product-service
              slo: availability
            annotations:
              summary: "golang-product-service burning error budget at 14.4x (1h/5m)"
              description: "5xx ratio over both the 1h and 5m windows exceeds a 14.4x burn rate against the 99.5% availability SLO. At this rate the 30-day error budget is exhausted in about 2 days."
          - alert: GolangProductServiceErrorBudgetBurnMedium
            expr: |
              (
                sum(rate(http_server_duration_milliseconds_count{service_name="golang-product-service", http_status_code=~"5.."}[6h]))
                /
                sum(rate(http_server_duration_milliseconds_count{service_name="golang-product-service"}[6h]))
              ) > (6 * 0.005)
              and
              (
                sum(rate(http_server_duration_milliseconds_count{service_name="golang-product-service", http_status_code=~"5.."}[30m]))
                /
                sum(rate(http_server_duration_milliseconds_count{service_name="golang-product-service"}[30m]))
              ) > (6 * 0.005)
            for: 15m
            labels:
              severity: page
              service: golang-product-service
              slo: availability
            annotations:
              summary: "golang-product-service burning error budget at 6x (6h/30m)"
              description: "5xx ratio over both the 6h and 30m windows exceeds a 6x burn rate against the 99.5% availability SLO. At this rate the 30-day error budget is exhausted in about 5 days."
          - alert: GolangProductServiceErrorBudgetBurnSlow
            expr: |
              (
                sum(rate(http_server_duration_milliseconds_count{service_name="golang-product-service", http_status_code=~"5.."}[1d]))
                /
                sum(rate(http_server_duration_milliseconds_count{service_name="golang-product-service"}[1d]))
              ) > (3 * 0.005)
              and
              (
                sum(rate(http_server_duration_milliseconds_count{service_name="golang-product-service", http_status_code=~"5.."}[2h]))
                /
                sum(rate(http_server_duration_milliseconds_count{service_name="golang-product-service"}[2h]))
              ) > (3 * 0.005)
            for: 1h
            labels:
              severity: ticket
              service: golang-product-service
              slo: availability
            annotations:
              summary: "golang-product-service burning error budget at 3x (1d/2h)"
              description: "5xx ratio over both the 1d and 2h windows exceeds a 3x burn rate against the 99.5% availability SLO. At this rate the 30-day error budget is exhausted in 10 days."
          - alert: GolangProductServiceErrorBudgetBurnSlowest
            expr: |
              (
                sum(rate(http_server_duration_milliseconds_count{service_name="golang-product-service", http_status_code=~"5.."}[3d]))
                /
                sum(rate(http_server_duration_milliseconds_count{service_name="golang-product-service"}[3d]))
              ) > (1 * 0.005)
              and
              (
                sum(rate(http_server_duration_milliseconds_count{service_name="golang-product-service", http_status_code=~"5.."}[6h]))
                /
                sum(rate(http_server_duration_milliseconds_count{service_name="golang-product-service"}[6h]))
              ) > (1 * 0.005)
            for: 3h
            labels:
              severity: ticket
              service: golang-product-service
              slo: availability
            annotations:
              summary: "golang-product-service burning error budget at 1x (3d/6h)"
              description: "5xx ratio over both the 3d and 6h windows exceeds the sustainable (1x) burn rate against the 99.5% availability SLO — the budget will run out exactly at the end of the 30-day window if this continues."

  python-product-info-service.yaml: |
    groups:
      - name: python-product-info-service-slo-burn-rate
        rules:
          - alert: PythonProductInfoServiceErrorBudgetBurnFast
            expr: |
              (
                sum(rate(http_server_request_duration_seconds_count{service_name="python-product-info-service", http_response_status_code=~"5.."}[1h]))
                /
                sum(rate(http_server_request_duration_seconds_count{service_name="python-product-info-service"}[1h]))
              ) > (14.4 * 0.005)
              and
              (
                sum(rate(http_server_request_duration_seconds_count{service_name="python-product-info-service", http_response_status_code=~"5.."}[5m]))
                /
                sum(rate(http_server_request_duration_seconds_count{service_name="python-product-info-service"}[5m]))
              ) > (14.4 * 0.005)
            for: 2m
            labels:
              severity: page
              service: python-product-info-service
              slo: availability
            annotations:
              summary: "python-product-info-service burning error budget at 14.4x (1h/5m)"
              description: "5xx ratio over both the 1h and 5m windows exceeds a 14.4x burn rate against the 99.5% availability SLO. At this rate the 30-day error budget is exhausted in about 2 days."
          - alert: PythonProductInfoServiceErrorBudgetBurnMedium
            expr: |
              (
                sum(rate(http_server_request_duration_seconds_count{service_name="python-product-info-service", http_response_status_code=~"5.."}[6h]))
                /
                sum(rate(http_server_request_duration_seconds_count{service_name="python-product-info-service"}[6h]))
              ) > (6 * 0.005)
              and
              (
                sum(rate(http_server_request_duration_seconds_count{service_name="python-product-info-service", http_response_status_code=~"5.."}[30m]))
                /
                sum(rate(http_server_request_duration_seconds_count{service_name="python-product-info-service"}[30m]))
              ) > (6 * 0.005)
            for: 15m
            labels:
              severity: page
              service: python-product-info-service
              slo: availability
            annotations:
              summary: "python-product-info-service burning error budget at 6x (6h/30m)"
              description: "5xx ratio over both the 6h and 30m windows exceeds a 6x burn rate against the 99.5% availability SLO. At this rate the 30-day error budget is exhausted in about 5 days."
          - alert: PythonProductInfoServiceErrorBudgetBurnSlow
            expr: |
              (
                sum(rate(http_server_request_duration_seconds_count{service_name="python-product-info-service", http_response_status_code=~"5.."}[1d]))
                /
                sum(rate(http_server_request_duration_seconds_count{service_name="python-product-info-service"}[1d]))
              ) > (3 * 0.005)
              and
              (
                sum(rate(http_server_request_duration_seconds_count{service_name="python-product-info-service", http_response_status_code=~"5.."}[2h]))
                /
                sum(rate(http_server_request_duration_seconds_count{service_name="python-product-info-service"}[2h]))
              ) > (3 * 0.005)
            for: 1h
            labels:
              severity: ticket
              service: python-product-info-service
              slo: availability
            annotations:
              summary: "python-product-info-service burning error budget at 3x (1d/2h)"
              description: "5xx ratio over both the 1d and 2h windows exceeds a 3x burn rate against the 99.5% availability SLO. At this rate the 30-day error budget is exhausted in 10 days."
          - alert: PythonProductInfoServiceErrorBudgetBurnSlowest
            expr: |
              (
                sum(rate(http_server_request_duration_seconds_count{service_name="python-product-info-service", http_response_status_code=~"5.."}[3d]))
                /
                sum(rate(http_server_request_duration_seconds_count{service_name="python-product-info-service"}[3d]))
              ) > (1 * 0.005)
              and
              (
                sum(rate(http_server_request_duration_seconds_count{service_name="python-product-info-service", http_response_status_code=~"5.."}[6h]))
                /
                sum(rate(http_server_request_duration_seconds_count{service_name="python-product-info-service"}[6h]))
              ) > (1 * 0.005)
            for: 3h
            labels:
              severity: ticket
              service: python-product-info-service
              slo: availability
            annotations:
              summary: "python-product-info-service burning error budget at 1x (3d/6h)"
              description: "5xx ratio over both the 3d and 6h windows exceeds the sustainable (1x) burn rate against the 99.5% availability SLO — the budget will run out exactly at the end of the 30-day window if this continues."
