# ==============================================================================
# Optional: Kafka Stub for Enterprise Telemetry Ingestion Buffering
# ==============================================================================
# DEFAULT STATUS:
# - Disabled/Optional by default. By default, OTel Gateways stream directly to Loki/Tempo/Mimir.
# - SANDBOX NOTICE: This manifest runs a minimal 1-node KRaft stub (1 replica, 1 vCPU, 1 GiB RAM, 10 GiB gp3)
#   intended strictly for local testing and pipeline validation.
# - PRODUCTION SIZING (20,000+ App QPS / ~200,000 events/sec):
#   Do NOT run this single pod at scale. Deploy Amazon MSK or a 3-broker KRaft cluster:
#   * Brokers: 3x m7g.2xlarge (8 vCPU, 32 GiB RAM, 24 GiB allocated to OS pagecache)
#   * Partitions: 18 to 36 partitions per topic (otlp_spans, otlp_logs) for parallel OTel reading
#   * Disks: EBS gp3 provisioned at 3,000–6,000 IOPS and 250–500 MB/s throughput per broker
#   * Details: See docs/scale-and-capacity-planning.md#e-buffer-architecture-kafka-sizing--the-node-log-rotation-danger
#
# PURPOSE & ARCHITECTURAL USE CASE:
# - Absorbs extreme traffic spikes (5x-10x flash sales, thundering herds) without
#   collector `memory_limiter` dropping telemetry.
# - Prevents Kubelet Node Log Rotation Data Loss: At 20k QPS, kubelet's 50 MiB log buffer
#   rotates in <60s. Kafka allows DaemonSets to drain /var/log/pods/ at sub-ms latency,
#   preventing uncollected logs from being deleted during gateway or S3 slow-downs.
# - Decouples backend storage maintenance: provides 24-72 hours of disk-backed lag persistence.
# - Multi-consumer fan-out: allows streaming the same telemetry simultaneously to Loki,
#   OpenSearch SIEM, and S3 data lakes.
#
# STORAGE ARCHITECTURE & BEST PRACTICES:
# - NEVER use AWS EFS: Kafka relies on Linux OS pagecache, kernel memory mapping (mmap),
#   and zero-copy sendfile() syscalls. Network-attached NFS/EFS introduces locking latencies
#   and metadata synchronization stalls that cause broker desynchronization and lockups.
# - AWS EBS gp3 (Standard): Uses single-AZ dynamic PersistentVolumeClaims backed by
#   the AWS EBS CSI driver (StorageClass: gp3). Replication factor (RF=3) across 3 AZs
#   guarantees data durability and high availability.
# - Local NVMe SSDs (Ultra-Scale >100k QPS): Use EC2 instance store (c7gd, m7gd, r7gd, i4i)
#   with XFS formatting via Local Persistent Volumes (LPV) for maximum raw IOPS.
#
# HOW TO DEPLOY:
# 1. Apply this stub: `kubectl apply -f observability-platform/optional-extensions/kafka-stub.yaml`
# 2. Re-enable the `kafka/logs` exporter in `observability-platform/otel-collector-gateway.yaml`
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: observability
spec:
  ports:
    - name: client
      port: 9092
      protocol: TCP
      targetPort: 9092
  selector:
    app.kubernetes.io/name: kafka-stub
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-stub
  namespace: observability
spec:
  replicas: 1
  serviceName: kafka
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-stub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-stub
    spec:
      # Isolate to dedicated on-demand storage nodes (avoids Spot interruption churn)
      nodeSelector:
        dedicated: monitoring-stateful
      tolerations:
        - key: dedicated
          operator: Equal
          value: monitoring-stateful
          effect: NoSchedule
      containers:
        - name: kafka
          image: bitnami/kafka:3.6
          env:
            - name: KAFKA_CFG_NODE_ID
              value: "0"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: "controller,broker"
            - name: KAFKA_CFG_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-stub-0.kafka.observability.svc.cluster.local:9093"
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
          ports:
            - name: client
              containerPort: 9092
          volumeMounts:
            - name: data
              mountPath: /bitnami/kafka/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 10Gi
