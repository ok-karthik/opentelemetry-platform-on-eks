# ==============================================================================
# OpenTelemetry Gateway Config: Tail-Based Sampling & Telemetry Budgeting
# ==============================================================================
# Demonstrates platform-level "Telemetry Budgeting" at the Tier 2 Gateway.
# In high-throughput microservice systems, storing 100% of healthy HTTP 200 traces
# is financially wasteful.
#
# Tail-based sampling evaluates the entire distributed trace waterfall *after*
# all spans arrive (routed via Tier 1 consistent hashing) before deciding whether
# to retain or drop.
# ==============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  # 1. Memory Limiter protects the gateway pod from memory exhaustion
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15

  # 2. Rate Limiting / Budgeting: Drop spans from noisy or over-quota tenants
  filter/budgeting:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["tenant.id"] == "abusive-tenant"'
        - 'attributes["http.target"] == "/healthz"'

  # 3. Tail-Based Sampling Engine
  tail_sampling:
    decision_wait: 10s
    num_traces: 10000
    expected_new_traces_per_sec: 2000
    
    policies:
      # A. Retain 100% of all traces containing an ERROR status code
      - name: retain-errors
        type: status_code
        status_code: 
          status_codes: [ ERROR ]
          
      # B. Retain 100% of HTTP 5xx errors
      - name: retain-http-5xx
        type: numeric_attribute
        numeric_attribute: 
          key: "http.response.status_code"
          min_value: 500
          max_value: 599

      # C. Retain 100% of slow requests (> 500 ms) for latency bottleneck debugging
      - name: retain-high-latency
        type: latency
        latency: 
          threshold_ms: 500

      # D. Sample normal, healthy HTTP 200 transactions down to 5% for baseline metrics
      - name: sample-healthy-traffic
        type: probabilistic
        probabilistic: 
          sampling_percentage: 5.0

  batch:
    send_batch_size: 1024
    timeout: 1s

exporters:
  otlp/tempo:
    endpoint: "tempo.monitoring.svc.cluster.local:4317"
    compression: gzip
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/budgeting, tail_sampling, batch]
      exporters: [otlp/tempo]
