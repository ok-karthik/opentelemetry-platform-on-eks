# ==============================================================================
# [OPTIONAL / REFERENCE TEMPLATE] Argo CD Root Application (App-of-Apps Pattern)
# ==============================================================================
# NOTE: Active deployment in this repository is managed directly via Terraform
# (`make k8s-create`) and Makefile (`make k8s-deploy-all`).
#
# This file serves as an enterprise reference template if you choose to enable
# the AWS EKS Managed Capability for Argo CD (`control-plane-argocd`) on the cluster.
#
# HOW IT WORKS:
# - Runs inside AWS-managed service infrastructure (zero worker node compute/RAM).
# - Automatically discovers and reconciles all child Application manifests located
#   in the `apps/` directory across both EKS clusters.
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-platform-apps
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/ok-karthik/opentelemetry-platform-on-eks.git
    targetRevision: main
    path: observability-platform/platform-as-a-product/argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
