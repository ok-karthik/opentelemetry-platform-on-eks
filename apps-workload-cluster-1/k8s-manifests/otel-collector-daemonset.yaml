apiVersion: v1
kind: Service
metadata:
  name: otel-gateway-regional
  namespace: monitoring
spec:
  type: ExternalName
  externalName: <OTEL_GATEWAY_LB_HOST>
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector-agent
  namespace: monitoring
spec:
  mode: daemonset
  # Pinned to contrib explicitly. The OTel Operator's default collector image is
  # the slim `opentelemetry-collector-k8s` distribution, which does not ship
  # every processor used below (groupbyattrs among them) — a collector
  # referencing a component its binary lacks fails to start at all.
  image: otel/opentelemetry-collector-contrib:0.156.0

  # Binds the OTLP receivers on each node's own IP so workloads can reach their
  # node-local agent via the Downward API (status.hostIP). dnsPolicy is set
  # explicitly rather than left to the operator's default, because the agent
  # still has to resolve otel-gateway-regional.monitoring.svc.cluster.local
  # through CoreDNS while sharing the host's network namespace.
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 384Mi
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/monitoring_otel-collector-*/*/*.log
        include_file_path: true
        start_at: end
        operators:
          - type: container
      kubeletstats:
        collection_interval: 10s
        auth_type: "serviceAccount"
        endpoint: "https://${env:K8S_NODE_NAME}:10250"
        insecure_skip_verify: true

    processors:
      batch: {}
      groupbyattrs:
        keys:
          - service.name
      transform/logs:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(attributes["service.name"], "golang-product-service") where IsMatch(attributes["log.file.path"], ".*/golang-app/.*")
              - set(attributes["service.name"], "python-product-info-service") where IsMatch(attributes["log.file.path"], ".*/python-app/.*")

      # The k8sattributes processor calls the K8s API to find the owner pod
      # of the incoming OTLP IP, adding crucial metadata tags to traces.
      #
      # `filter.node_from_env_var` restricts this collector's pod cache to pods
      # running on its OWN node, which keeps the watch cheap at scale. It also
      # means enrichment only works for telemetry that arrives from a co-located
      # pod — so workloads must target the node-local agent via the Downward API
      # (status.hostIP), never the ClusterIP Service. Sending through the
      # Service round-robins across nodes and silently produces spans with no
      # k8s.* attributes whenever it lands on the wrong collector.
      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.namespace.name
            - k8s.node.name
            - k8s.container.name
            - k8s.deployment.name
        pod_association:
          - sources:
              - from: connection # associates trace by client socket IP address

      # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/processor/resourceprocessor/README.md
      resource:
        attributes:
          - key: team
            value: product
            action: upsert

    exporters:
      # Forwards enriched telemetry to a stable in-cluster alias for the regional gateway.
      # The alias is backed by otel-gateway-regional-externalname.yaml in this demo
      # and should be rendered from Helm/cluster bootstrap values in production.
      otlp:
        endpoint: otel-gateway-regional.monitoring.svc.cluster.local:4317
        tls:
          insecure: true

    service:
      pipelines:
        # `resource` is wired into all three pipelines on purpose: a processor
        # that is declared but left out of every pipeline is inert, and the
        # team=product attribute it adds is what downstream routing, dashboards
        # and cost allocation key off.
        traces:
          receivers: [otlp]
          processors: [k8sattributes, resource, batch]
          exporters: [otlp]
        metrics:
          receivers: [otlp, kubeletstats]
          processors: [k8sattributes, resource, batch]
          exporters: [otlp]
        logs:
          receivers: [otlp, filelog]
          processors:
            [k8sattributes, resource, transform/logs, groupbyattrs, batch]
          exporters: [otlp]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-agent-role
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes", "nodes/stats", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-agent-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-agent-role
subjects:
  - kind: ServiceAccount
    name: otel-collector-agent-collector
    namespace: monitoring
