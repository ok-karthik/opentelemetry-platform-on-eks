apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-product-info-service
  namespace: default
  labels:
    app: python-product-info-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-product-info-service
  template:
    metadata:
      labels:
        app: python-product-info-service
      annotations:
        # ==================== OTel Auto-Instrumentation Injection ====================
        # This annotation tells the OpenTelemetry Operator to dynamically inject
        # the OTel SDK wrapper into this Python container during pod startup.
        # It references the 'python-instrumentation' Instrumentation CRD we created.
        instrumentation.opentelemetry.io/inject-python: "python-instrumentation"
    spec:
      containers:
        - name: python-app
          image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/python-product-info-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          env:
            - name: OTEL_SERVICE_NAME
              value: "python-product-info-service"

            # Same node-local routing as the Go service — see the comment in
            # golang-app/golang-product-service.yaml. Set here as well as in the
            # Instrumentation CR because the operator does not overwrite an
            # environment variable a container already declares.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4317"

            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: "http"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=product,service.version=1.0.0,deployment.environment=dev,team=product"

---
apiVersion: v1
kind: Service
metadata:
  name: python-app
  namespace: default
spec:
  ports:
    - name: http
      port: 8001
      targetPort: 8001
  selector:
    app: python-product-info-service
