apiVersion: apps/v1
kind: Deployment
metadata:
  name: golang-product-service
  namespace: default
  labels:
    app: golang-product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: golang-product-service
  template:
    metadata:
      labels:
        app: golang-product-service
    spec:
      containers:
        - name: golang-app
          image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/golang-product-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
          env:
            - name: PORT
              value: "8080"
            - name: PRODUCT_INFO_SERVICE_URL
              value: "http://python-app:8001"
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: "http"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=product,service.version=1.0.0,deployment.environment=dev,team=product"

            # ==================== EKS Downward API ====================
            # The collector runs as a DaemonSet and enriches telemetry with
            # k8sattributes scoped to its own node (node_from_env_var). Talking
            # to the ClusterIP Service would round-robin across nodes and drop
            # that enrichment whenever the request landed on a different node's
            # collector, so the pod resolves its own node's IP instead and the
            # SDK exports to the agent running there.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4317"
---
apiVersion: v1
kind: Service
metadata:
  name: golang-app
  namespace: default
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: golang-product-service
