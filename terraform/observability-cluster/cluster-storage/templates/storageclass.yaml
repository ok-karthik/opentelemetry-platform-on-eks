# gp3 StorageClass backed by the aws-ebs-csi-driver EKS add-on.
#
# This used to live in the karpenter-provisioner chart, which is installed after
# Karpenter. Loki, Tempo and Mimir all create PersistentVolumeClaims, and with
# `-parallelism=20` Terraform was free to start those releases before the
# StorageClass existed — leaving the claims Pending until the Helm timeout.
#
# It is now its own release that every stateful release depends on.
#
# EKS also ships a `gp2` StorageClass annotated as default, so two defaults
# would exist in the cluster. Rather than rely on the admission plugin's
# tie-break, every PVC in helm-values/ names `gp3` explicitly.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"
