apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector-tier1-agent
  namespace: monitoring
spec:
  mode: daemonset
  # Pinned to contrib explicitly. The OTel Operator's default collector image is
  # the slim `opentelemetry-collector-k8s` distribution, which does not ship
  # every processor used below (groupbyattrs among them) — a collector
  # referencing a component its binary lacks fails to start at all.
  image: otel/opentelemetry-collector-contrib:0.156.0

  # Binds the OTLP receivers on each node's own IP so workloads can reach their
  # node-local agent via the Downward API (status.hostIP). dnsPolicy is set
  # explicitly rather than left to the operator's default, because the agent
  # still has to resolve in-cluster gateway DNS through CoreDNS while sharing
  # the host's network namespace.
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 384Mi
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    # Go runtime GC tuning to prevent container OOMKills under heavy telemetry bursts.
    # Sets Go memory limit to ~80% of container limit (384MiB * 0.8 ≈ 300MiB).
    - name: GOMEMLIMIT
      value: "300MiB"
    # Runs GC slightly earlier to maintain safe heap headroom without CPU thrashing.
    - name: GOGC
      value: "80"
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
  config:
    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus/agent_telemetry:
        config:
          scrape_configs:
            - job_name: 'otel-collector-tier1-agent'
              scrape_interval: 15s
              static_configs:
                - targets: ['127.0.0.1:8888']

      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/monitoring_otel-collector-*/*/*.log
        include_file_path: true
        start_at: end
        operators:
          - type: container
      kubeletstats:
        collection_interval: 10s
        auth_type: "serviceAccount"
        endpoint: "https://${env:K8S_NODE_NAME}:10250"
        insecure_skip_verify: true

    processors:
      # Batch processor tuned for high throughput: groups telemetry before gzip export
      # to prevent gRPC connection saturation and reduce system call overhead.
      batch:
        send_batch_size: 4096
        send_batch_max_size: 8192
        timeout: 500ms
      groupbyattrs:
        keys:
          - service.name
      transform/logs:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              # Fallback metadata enrichment: If service.name was not populated via OTLP SDK
              # or k8s labels, default to deployment name or container name with O(1) assignment.
              - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["service.name"] == nil and attributes["k8s.deployment.name"] != nil
              - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["service.name"] == nil and attributes["k8s.container.name"] != nil

      # The k8sattributes processor calls the K8s API to find the owner pod
      # of the incoming OTLP IP or container log, adding crucial metadata tags.
      #
      # `filter.node_from_env_var` restricts this collector's pod cache to pods
      # running on its OWN node, which keeps the watch cheap at scale. It also
      # means enrichment only works for telemetry that arrives from a co-located
      # pod — so workloads must target the node-local agent via the Downward API
      # (status.hostIP), never the ClusterIP Service. Sending through the
      # Service round-robins across nodes and silently produces spans with no
      # k8s.* attributes whenever it lands on the wrong collector.
      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.namespace.name
            - k8s.node.name
            - k8s.container.name
            - k8s.deployment.name
          labels:
            # Auto-extract service name from standard Kubernetes pod labels
            - tag_name: service.name
              key: app.kubernetes.io/name
              from: pod
            - tag_name: service.name
              key: app
              from: pod
        pod_association:
          # Associates filelog container logs via resource attributes extracted by container operator
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: resource_attribute
                name: k8s.namespace.name
          # Associates OTLP traces & metrics via client socket IP address
          - sources:
              - from: connection

      # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/processor/resourceprocessor/README.md
      resource:
        attributes:
          - key: team
            value: product
            action: upsert
          - key: service.name
            value: node-agent
            action: insert

    exporters:
      # Forwards telemetry directly to the Tier 2 gateway router (ClusterIP in single-cluster, NLB in multi-cluster).
      otlp:
        endpoint: <OTEL_GATEWAY_LB_HOST>:4317
        compression: zstd
        tls:
          insecure: true

    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        # `resource` is wired into all three pipelines on purpose: a processor
        # that is declared but left out of every pipeline is inert, and the
        # team=product attribute it adds is what downstream routing, dashboards
        # and cost allocation key off.
        traces:
          receivers: [otlp]
          processors: [k8sattributes, resource, batch]
          exporters: [otlp]
        metrics:
          receivers: [otlp, kubeletstats, prometheus/agent_telemetry]
          processors: [k8sattributes, resource, batch]
          exporters: [otlp]
        logs:
          receivers: [otlp, filelog]
          processors:
            [k8sattributes, resource, transform/logs, groupbyattrs, batch]
          exporters: [otlp]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-tier1-agent-role
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes", "nodes/stats", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-tier1-agent-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-tier1-agent-role
subjects:
  - kind: ServiceAccount
    name: otel-collector-tier1-agent-collector
    namespace: monitoring
---
# [ENTERPRISE PATTERN: OpenTelemetry eBPF Instrumentation (OBI)]
# Zero-code RED metrics and traces captured straight from the kernel, for
# processes that were never given an OTel SDK. OBI is a distinct upstream
# project (open-telemetry/opentelemetry-ebpf-instrumentation) from the
# Collector — there is no `obi` receiver in the `opentelemetry-collector-contrib`
# image, so it cannot be bolted onto otel-collector-agent above via config.
# The only supported paths are a custom OCB-built collector binary or running
# OBI as its own process, which is what this DaemonSet does.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: obi-agent
  namespace: monitoring
  labels:
    app: obi-agent
spec:
  selector:
    matchLabels:
      app: obi-agent
  template:
    metadata:
      labels:
        app: obi-agent
    spec:
      # eBPF probes attach to processes across the whole node, not just this
      # pod, so OBI needs the host PID namespace — the Pod-scoped
      # `shareProcessNamespace` used for sidecar deployments isn't enough here.
      hostPID: true
      # Shares the node network namespace so OBI can reach the node-local
      # otel-collector-agent pod at localhost:4318 — the same collector the
      # SDK-instrumented Go and Python services already export to via
      # status.hostIP. OBI's RED metrics and traces get k8sattributes
      # enrichment, team=product tagging, and gateway routing for free instead
      # of a second, uncorrelated export path straight to the gateway.
      hostNetwork: true
      serviceAccountName: obi-agent
      containers:
        - name: obi
          image: otel/ebpf-instrument:v0.12.2
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - BPF                # required for most eBPF probes
                - SYS_PTRACE          # inspect executables across container namespaces
                - NET_RAW             # socket filters for HTTP capture
                - CHECKPOINT_RESTORE  # open ELF files
                - DAC_READ_SEARCH     # open ELF files
                - PERFMON             # load BPF programs
              drop:
                - ALL
          env:
            # Matches the ports golang-product-service (8080) and
            # python-product-info-service (8001) listen on. Deliberately not
            # OTEL_EBPF_AUTO_TARGET_EXE=*: with hostPID:true this process sees
            # every binary on the node, and the Go service's binary is named
            # `main` — far too generic to match by executable name safely.
            - name: OTEL_EBPF_OPEN_PORT
              value: "8080,8001"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://localhost:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            # otel-collector-agent's k8sattributes processor associates telemetry
            # to a pod by matching the client socket's source IP against known
            # pod IPs. OBI talks to the collector over the loopback interface
            # (both run hostNetwork on the same node), so that source IP is
            # 127.0.0.1 and k8sattributes can never resolve it to a pod. OBI has
            # to attach k8s.* metadata itself instead, using the ClusterRole below.
            - name: OTEL_EBPF_KUBE_METADATA_ENABLE
              value: "true"
          volumeMounts:
            - name: var-run-obi
              mountPath: /var/run/obi
      volumes:
        - name: var-run-obi
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: obi-agent
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: obi-agent-role
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: obi-agent-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: obi-agent-role
subjects:
  - kind: ServiceAccount
    name: obi-agent
    namespace: monitoring
