# ==============================================================================
# Sample Workload: Istio Bookinfo Polyglot Microservices (Runs WITHOUT Istio)
#
# Purpose:
# Demonstrates how the 3-Tier OpenTelemetry Platform (OBI eBPF + OTel Operator)
# provides comprehensive golden signal metrics (Rate, Errors, Duration), network
# topology, and distributed tracing across polyglot microservices (Python, Ruby,
# Java, Node.js) with ZERO Envoy sidecars and ZERO proxy latency overhead.
#
# Architecture Topology:
#   [Traffic Generator]
#           │ (GET /productpage)
#           ▼
#     productpage (Python:9080) ────┬───► details (Ruby:9080)
#                                   └───► reviews (Java:9080) ───► ratings (Node.js:9080)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Details Service (Ruby)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: details
  namespace: default
  labels:
    app: details
    service: details
spec:
  ports:
    - port: 9080
      name: http
  selector:
    app: details
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: details-v1
  namespace: default
  labels:
    app: details
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: details
      version: v1
  template:
    metadata:
      labels:
        app: details
        version: v1
        app.kubernetes.io/name: bookinfo-details
    spec:
      containers:
        - name: details
          image: docker.io/istio/examples-bookinfo-details-v1:1.20.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
