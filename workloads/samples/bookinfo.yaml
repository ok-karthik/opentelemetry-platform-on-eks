# ------------------------------------------------------------------------------
# 4. ProductPage Service (Python)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: productpage
  namespace: default
  labels:
    app: productpage
    service: productpage
spec:
  ports:
    - port: 9080
      name: http
  selector:
    app: productpage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productpage-v1
  namespace: default
  labels:
    app: productpage
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productpage
      version: v1
  template:
    metadata:
      labels:
        app: productpage
        version: v1
        app.kubernetes.io/name: bookinfo-productpage
      # Optional: To test Level 2 OTel Operator Auto-Instrumentation on Python, uncomment:
      # annotations:
      #   instrumentation.opentelemetry.io/inject-python: "python-instrumentation"
    spec:
      containers:
        - name: productpage
          image: docker.io/istio/examples-bookinfo-productpage-v1:1.20.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9080
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 96Mi
---
# ------------------------------------------------------------------------------
# 5. Synthetic Traffic Generator for Bookinfo
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookinfo-traffic-generator
  namespace: default
  labels:
    app.kubernetes.io/name: bookinfo-traffic-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookinfo-traffic-generator
  template:
    metadata:
      labels:
        app: bookinfo-traffic-generator
    spec:
      containers:
        - name: traffic-gen
          image: curlimages/curl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for productpage to become ready..."
              sleep 5
              echo "Starting continuous traffic loop against http://productpage:9080/productpage ..."
              while true; do
                curl -s -o /dev/null -w "Bookinfo HTTP %{http_code} in %{time_total}s\n" http://productpage:9080/productpage
                sleep 0.5
              done
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
